<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>投票二维码</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .qr-container {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      text-align: center;
    }
    h1 {
      margin: 0 0 20px 0;
      color: #333;
    }
    #qrcode {
      margin: 20px 0;
    }
    .url {
      color: #666;
      font-size: 14px;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="qr-container">
    <h1>部门评选投票</h1>
    <p>请使用微信扫码参与投票</p>
    <div id="qrcode"></div>
    <p class="url" id="url">加载中...</p>
  </div>

  <script>
    fetch('/api/qrcode')
      .then(res => res.json())
      .then(data => {
        const img = document.createElement('img');
        img.src = data.qrcode;
        img.style.width = '300px';
        img.style.height = '300px';
        document.getElementById('qrcode').appendChild(img);
        document.getElementById('url').textContent = data.url;
      })
      .catch(err => {
        document.getElementById('qrcode').textContent = '加载失败';
      });
  </script>
</body>
</html>
