<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>投票二维码</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .qr-container {
      background: white;
      padding: 50px;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      text-align: center;
      max-width: 500px;
    }
    h1 {
      margin: 0 0 10px 0;
      color: #333;
      font-size: 32px;
    }
    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 18px;
    }
    #qrcode {
      margin: 20px 0;
    }
    #qrcode img {
      border: 3px solid #1890ff;
      border-radius: 8px;
      padding: 10px;
    }
    .url {
      color: #666;
      font-size: 14px;
      word-break: break-all;
      margin-top: 20px;
    }
    .countdown-section {
      display: none;
      margin-top: 30px;
      padding-top: 30px;
      border-top: 2px solid #f0f0f0;
    }
    .countdown-section.active {
      display: block;
    }
    .countdown-timer {
      font-size: 72px;
      font-weight: 700;
      color: #1890ff;
      margin: 20px 0;
      font-family: 'Courier New', monospace;
    }
    .countdown-timer.warning {
      color: #ff4d4f;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    .countdown-label {
      font-size: 20px;
      color: #666;
      margin-bottom: 10px;
    }
    .status-message {
      font-size: 18px;
      color: #52c41a;
      margin-top: 20px;
      font-weight: 600;
    }
    .btn {
      padding: 16px 40px;
      font-size: 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
      margin-top: 20px;
    }
    .btn-primary {
      background: #1890ff;
      color: white;
    }
    .btn-primary:hover {
      background: #096dd9;
    }
    .btn-primary:disabled {
      background: #d9d9d9;
      cursor: not-allowed;
    }
    .password-input {
      display: none;
      margin-top: 20px;
    }
    .password-input.active {
      display: block;
    }
    .password-input input {
      padding: 12px;
      font-size: 16px;
      border: 2px solid #d9d9d9;
      border-radius: 6px;
      margin-right: 10px;
      width: 200px;
    }
    .btn-small {
      padding: 12px 24px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="qr-container">
    <h1>部门评选投票</h1>
    <p class="subtitle">请使用微信扫码参与投票</p>
    <div id="qrcode"></div>
    <p class="url" id="url">加载中...</p>

    <div id="startSection">
      <button id="showPasswordBtn" class="btn btn-primary">开始投票（管理员）</button>

      <div id="passwordSection" class="password-input">
        <input type="password" id="passwordInput" placeholder="请输入管理员密码">
        <button id="confirmStartBtn" class="btn btn-primary btn-small">确认开始</button>
      </div>
    </div>

    <div id="countdownSection" class="countdown-section">
      <div class="countdown-label">投票倒计时</div>
      <div id="countdownTimer" class="countdown-timer">3:00</div>
      <div class="status-message">投票进行中，请扫码参与</div>
    </div>
  </div>

  <script src="/js/countdown-utils.js"></script>
  <script>
    let countdownInterval = null;

    // 加载二维码
    fetch('/api/qrcode')
      .then(res => res.json())
      .then(data => {
        const img = document.createElement('img');
        img.src = data.qrcode;
        img.style.width = '300px';
        img.style.height = '300px';
        document.getElementById('qrcode').appendChild(img);
        document.getElementById('url').textContent = data.url;
      })
      .catch(err => {
        document.getElementById('qrcode').textContent = '加载失败';
      });

    // 显示密码输入框
    document.getElementById('showPasswordBtn').addEventListener('click', () => {
      document.getElementById('passwordSection').classList.add('active');
      document.getElementById('passwordInput').focus();
    });

    // 确认开始投票
    document.getElementById('confirmStartBtn').addEventListener('click', async () => {
      const password = document.getElementById('passwordInput').value;

      if (!password) {
        alert('请输入管理员密码');
        return;
      }

      try {
        // 先登录
        const loginRes = await fetch('/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });

        if (!loginRes.ok) {
          alert('密码错误');
          return;
        }

        // 开始投票
        const startRes = await fetch('/admin/start-voting', {
          method: 'POST'
        });

        if (startRes.ok) {
          const data = await startRes.json();
          startCountdown(data.remainingSeconds, data.totalSeconds);

          // 隐藏开始按钮
          document.getElementById('startSection').style.display = 'none';
          document.getElementById('countdownSection').classList.add('active');
        } else {
          alert('启动投票失败');
        }
      } catch (error) {
        alert('操作失败：' + error.message);
      }
    });

    // 开始倒计时
    // remainingSeconds 由服务端下发，以本页加载时刻为起点做本地递减，
    // 不再拿服务器时间戳减本机 Date.now()，避免时钟偏差把 3:00 显示成 3:30
    function startCountdown(remainingSeconds, totalSeconds) {
      const maxSeconds = Number(totalSeconds) > 0 ? Number(totalSeconds) : COUNTDOWN_MAX_SECONDS;
      const startedAt = Date.now();
      const initialMs = clampRemainingSeconds(remainingSeconds * 1000, maxSeconds) * 1000;

      if (countdownInterval) {
        clearInterval(countdownInterval);
      }

      const timerElement = document.getElementById('countdownTimer');
      timerElement.classList.remove('warning');

      function updateTimer() {
        const remaining = Math.max(0, initialMs - (Date.now() - startedAt));
        const seconds = clampRemainingSeconds(remaining, maxSeconds);

        timerElement.textContent = formatCountdown(remaining, maxSeconds);

        // 最后30秒显示警告色
        timerElement.classList.toggle('warning', seconds <= 30 && seconds > 0);

        // 倒计时结束
        if (remaining === 0) {
          clearInterval(countdownInterval);
          countdownInterval = null;
          timerElement.textContent = '0:00';
          setTimeout(() => {
            // 跳转到结果页
            window.location.href = '/results';
          }, 2000);
        }
      }

      updateTimer();
      countdownInterval = setInterval(updateTimer, 100);
    }

    // 检查是否已经在投票中
    fetch('/api/voting-status')
      .then(res => res.json())
      .then(data => {
        if (data.enabled && data.hasTimer && data.remainingSeconds > 0) {
          // 已经在投票中，直接显示倒计时
          startCountdown(data.remainingSeconds, data.totalSeconds);
          document.getElementById('startSection').style.display = 'none';
          document.getElementById('countdownSection').classList.add('active');
        }
      });
  </script>
</body>
</html>
