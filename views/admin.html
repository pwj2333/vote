<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>后台管理</title>
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <div id="loginPanel" class="login-panel">
    <div class="login-box">
      <h2>后台登录</h2>
      <input type="password" id="passwordInput" class="form-input" placeholder="请输入管理员密码">
      <button id="loginBtn" class="btn btn-primary">登录</button>
      <p id="loginError" class="error-message" style="display: none;"></p>
    </div>
  </div>

  <div id="adminPanel" class="admin-panel" style="display: none;">
    <header class="admin-header">
      <h1>部门评选投票 - 后台管理</h1>
    </header>

    <div class="control-panel">
      <div class="control-item">
        <button id="toggleVotingBtn" class="btn btn-toggle">
          <span id="votingStatus">加载中...</span>
        </button>
      </div>
      <div class="control-item">
        <button id="resetBtn" class="btn btn-danger">重置所有数据</button>
      </div>
      <div class="control-item">
        <button id="exportBtn" class="btn btn-success">导出 Excel</button>
      </div>
    </div>

    <div class="stats-panel">
      <div class="stat-card">
        <div class="stat-label">总投票人数</div>
        <div class="stat-value" id="totalVoters">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">总票数</div>
        <div class="stat-value" id="totalVotes">0</div>
      </div>
    </div>

    <section class="section">
      <h2>实时排名</h2>
      <table class="ranking-table">
        <thead>
          <tr>
            <th>排名</th>
            <th>部门名称</th>
            <th>得票数</th>
            <th>占比</th>
          </tr>
        </thead>
        <tbody id="rankingBody">
          <tr><td colspan="4">加载中...</td></tr>
        </tbody>
      </table>
    </section>

    <section class="section">
      <h2>
        <button id="toggleDetailsBtn" class="btn-link">查看投票记录</button>
      </h2>
      <div id="detailsPanel" style="display: none;">
        <table class="details-table">
          <thead>
            <tr>
              <th>编号</th>
              <th>投票人</th>
              <th>所属部门</th>
              <th>投给部门</th>
              <th>投票时间</th>
            </tr>
          </thead>
          <tbody id="detailsBody">
            <tr><td colspan="5">暂无数据</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="/js/admin.js"></script>
</body>
</html>
